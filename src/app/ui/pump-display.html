<button
  type="button"
  class="well"
  [class.well--active]="active()"
  [attr.aria-label]="label()"
  [attr.aria-pressed]="active()"
  (click)="selected.emit()"
>
  <span class="label label-row">
    @switch (kind()) {
      @case ('odometer') {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 16a7 7 0 1 1 14 0" />
          <path d="M12 16 9 11" />
          <circle cx="12" cy="16" r="1.4" />
        </svg>
      }
      @case ('liters') {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3.5s6 6.2 6 10.2a6 6 0 1 1-12 0C6 9.7 12 3.5 12 3.5z" />
        </svg>
      }
      @case ('cost') {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="9" cy="11" r="5.2" />
          <circle cx="15" cy="13.5" r="5.2" />
        </svg>
      }
    }
    {{ label() }}
  </span>
  <span class="lcd" [class.lcd--on]="active()">
    <span class="value">{{ value() || '—' }}</span>
  </span>
  @if (hint()) {
    <span class="hint">{{ hint() }}</span>
  }
</button>
