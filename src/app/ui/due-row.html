<div
  class="due-card"
  [class.due-card--overdue]="status() === 'overdue'"
  [class.due-card--soon]="status() === 'dueSoon'"
>
  <span
    class="due-card__icon"
    [class.due-card__icon--overdue]="status() === 'overdue'"
    [class.due-card__icon--soon]="status() === 'dueSoon'"
    aria-hidden="true"
  >
    @if (kind() === 'paper') {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
        <path d="M14 2v8h6" />
        <path d="M16 13H8" />
        <path d="M16 17H8" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
      </svg>
    }
  </span>
  <div class="due-card__body">
    <div class="title">{{ title() }}</div>
    @if (meta()) {
      <div class="meta">{{ meta() }}</div>
    }
  </div>
  <div class="due-card__status">
    <div
      class="status"
      [class.status--stop]="status() === 'overdue'"
      [class.status--muted]="status() === 'dueSoon'"
    >
      {{ statusLabel() }}
    </div>
    @if (statusSub()) {
      <div class="status-sub">{{ statusSub() }}</div>
    }
  </div>
</div>
