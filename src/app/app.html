<app-shell />
@if (splashVisible()) {
  <div class="splash" role="status" [attr.aria-label]="i18n.t('app.name')">
    <div class="splash__logo">
      <img src="icons/icon-192x192.png" width="192" height="192" alt="" aria-hidden="true" />
    </div>
    <p class="splash__ver">v{{ version }}</p>
  </div>
}
