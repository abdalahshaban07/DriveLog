<div class="stack setup page-narrow">
  <app-page-header [eyebrow]="i18n.t('app.subtitle')" [title]="i18n.t('setup.title')" />

  <div class="setup__progress" aria-hidden="true">
    <span [class.setup__dot--on]="step() >= 1"></span>
    <span class="setup__rail"></span>
    <span [class.setup__dot--on]="step() >= 2"></span>
  </div>

  @if (step() === 1) {
    <section class="card stack" [attr.aria-label]="i18n.t('setup.vehicle')">
      <p class="label">{{ i18n.t('setup.step1') }}</p>
      <app-text-field
        [label]="i18n.t('setup.nickname')"
        [formField]="setupForm.nickname"
        [error]="nickError()"
      />
      <app-numeric-field
        [label]="i18n.t('setup.odometer')"
        [formField]="setupForm.odometer"
        [error]="odoError()"
      />
      <app-numeric-field
        [label]="i18n.t('setup.tankCapacity')"
        [formField]="setupForm.tankCapacity"
        [error]="tankCapError()"
      />
      <app-text-field
        [label]="i18n.t('setup.plate')"
        [(value)]="plate"
      />
      <app-date-field
        [label]="i18n.t('setup.license')"
        [(value)]="licenseExpiry"
        mode="due"
      />
      <app-date-field
        [label]="i18n.t('setup.registration')"
        [(value)]="registrationExpiry"
        mode="due"
      />
    </section>
    <app-primary-button
      [label]="i18n.t('setup.continue')"
      [disabled]="!canContinue()"
      (pressed)="goStep2()"
    />
    <button type="button" class="ghost-btn setup__sample" (click)="loadSample()">
      {{ i18n.t('setup.sample') }}
    </button>
  } @else {
    <section class="card stack" [attr.aria-label]="i18n.t('setup.prefs')">
      <p class="label">{{ i18n.t('setup.step2') }}</p>
      <app-select-field
        [label]="i18n.t('settings.theme')"
        [options]="themeOptions()"
        [value]="theme()"
        (valueChange)="onTheme($event)"
      />
      <app-select-field
        [label]="i18n.t('setup.language')"
        [options]="langOptions()"
        [value]="language()"
        (valueChange)="onLang($event)"
      />
      <app-select-field
        [label]="i18n.t('setup.currency')"
        [options]="currencyOptions()"
        [(value)]="currency"
      />
    </section>
    <div class="setup__actions">
      <button type="button" class="ghost-btn" (click)="backStep1()">
        {{ i18n.t('common.back') }}
      </button>
      <app-primary-button
        [label]="i18n.t('setup.finish')"
        [disabled]="!canContinue()"
        (pressed)="submit()"
      />
    </div>
  }
</div>
