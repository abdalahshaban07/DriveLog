<div class="scan-row" [attr.aria-busy]="scan.busy()">
  <input
    id="receipt-scan-input"
    class="sr-only"
    type="file"
    accept="image/*"
    capture="environment"
    (change)="scan.onScanFile($event)"
  />
  <input
    id="receipt-gallery-input"
    class="sr-only"
    type="file"
    accept="image/*"
    (change)="scan.onScanFile($event)"
  />
  <div class="scan-row__actions">
    <button
      type="button"
      class="scan-tile"
      [disabled]="scan.busy()"
      (click)="scan.scanSharedOrPick()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M4.5 8.5h3l1.4-2h6.2l1.4 2h3a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18v-8a1.5 1.5 0 0 1 1.5-1.5z"
        />
        <circle cx="12" cy="13.2" r="3" />
      </svg>
      <span>{{ scan.busy() ? i18n.t('fillUp.scanBusy') : i18n.t('fillUp.scan') }}</span>
    </button>
    <button
      type="button"
      class="scan-tile"
      [disabled]="scan.busy()"
      (click)="scan.pickFromGallery()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3.5" y="5" width="17" height="14" rx="2" />
        <path d="M3.5 15.5 7.7 12l3.4 2.6 2.6-1.8 6.8 4.6" />
      </svg>
      <span>{{ i18n.t('fillUp.scanGallery') }}</span>
    </button>
  </div>
  @if (scan.error()) {
    <p class="error-state" role="alert">{{ scan.error() }}</p>
  }
</div>
