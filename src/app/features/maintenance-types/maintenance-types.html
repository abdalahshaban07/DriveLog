<div class="stack">
  <app-page-header
    [title]="i18n.t('types.title')"
    [showBack]="true"
    (back)="router.navigateByUrl('/settings')"
  />

  <form class="card stack" (submit)="onSubmit($event)">
    <app-text-field
      [label]="i18n.t('types.name')"
      [(value)]="name"
      [error]="error()"
    />
    <app-primary-button [label]="i18n.t('types.add')" (pressed)="add()" />
  </form>

  <section class="card stack" [attr.aria-label]="i18n.t('types.builtins')">
    <p class="label">{{ i18n.t('types.builtins') }}</p>
    <ul class="chips">
      @for (b of builtins(); track b.value) {
        <li class="chip">{{ b.label }}</li>
      }
    </ul>
  </section>

  <section class="list" [attr.aria-label]="i18n.t('types.customs')">
    <p class="label">{{ i18n.t('types.customs') }}</p>
    @if (customs().length === 0) {
      <p class="muted">{{ i18n.t('types.empty') }}</p>
    }
    @for (item of customs(); track item) {
      <article class="due-card">
        <strong>{{ item }}</strong>
        <button
          type="button"
          class="danger"
          [attr.aria-label]="i18n.t('types.delete') + ' ' + item"
          (click)="askDelete(item)"
        >
          {{ i18n.t('types.delete') }}
        </button>
      </article>
    }
  </section>

  @if (pending()) {
    <app-confirm-bar
      [modal]="true"
      [message]="i18n.t('types.deleteConfirm')"
      [confirmLabel]="i18n.t('types.delete')"
      [cancelLabel]="i18n.t('common.cancel')"
      (confirmed)="doDelete()"
      (cancelled)="pending.set(null)"
    />
  }
</div>
