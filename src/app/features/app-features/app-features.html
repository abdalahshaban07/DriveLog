<div class="stack page-narrow features">
  <app-page-header
    [title]="i18n.t('settings.features')"
    [subtitle]="i18n.t('settings.featuresLead')"
    [showBack]="true"
    (back)="router.navigateByUrl('/more')"
  />

  <div class="features__ledger list-reveal">
    @for (group of groups; track group.headingKey; let gi = $index) {
      <section class="feature-group" [attr.aria-labelledby]="'feat-g-' + gi">
        <h2 class="feature-group__title" [id]="'feat-g-' + gi">
          {{ i18n.t(group.headingKey) }}
        </h2>
        <ul class="feature-group__list">
          @for (item of group.items; track item.titleKey) {
            <li class="feature-row">
              <strong class="feature-row__title">{{ i18n.t(item.titleKey) }}</strong>
              <span class="feature-row__body">{{ i18n.t(item.bodyKey) }}</span>
            </li>
          }
        </ul>
      </section>
    }
  </div>
</div>
