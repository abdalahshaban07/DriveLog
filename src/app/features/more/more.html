<div class="stack more">
  <app-page-header [title]="i18n.t('more.title')" />

  @for (section of sections(); track section.headingKey) {
    <section class="card list" [attr.aria-label]="i18n.t(section.headingKey)">
      <p class="section-label">{{ i18n.t(section.headingKey) }}</p>
      @for (item of section.items; track item.labelKey) {
        <a class="line" [routerLink]="item.route">
          <span class="line__text">
            <strong>{{ i18n.t(item.labelKey) }}</strong>
          </span>
          <svg class="line__go" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 6l6 6-6 6" />
          </svg>
        </a>
      }
    </section>
  }
</div>
