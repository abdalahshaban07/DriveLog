<div class="stack around-page">
  <app-page-header
    [title]="i18n.t('around.title')"
    [subtitle]="i18n.t('around.subtitle')"
  />
  <app-section-tabs [tabs]="tabs" [ariaLabel]="i18n.t('nav.fuel')" />

  @if (!requested()) {
    <section class="card around-finder" role="status" aria-live="polite">
      <div class="around-finder__visual" aria-hidden="true">
        <span class="around-finder__ring"></span>
        <span class="around-finder__ring"></span>
        <span class="around-finder__ring"></span>
        <span class="around-finder__core"></span>
      </div>
      <p class="around-finder__copy">{{ i18n.t('around.explain') }}</p>
      <app-numeric-field
        [label]="i18n.t('around.range')"
        [value]="rangeText()"
        [error]="rangeError()"
        (valueChange)="onRange($event)"
        (touch)="onRangeCommit()"
      />
      <app-primary-button
        [label]="i18n.t('around.useLocation')"
        [stretch]="true"
        (pressed)="useMyLocation()"
      />
    </section>
  } @else {
    <app-numeric-field
      [label]="i18n.t('around.range')"
      [value]="rangeText()"
      [error]="rangeError()"
      (valueChange)="onRange($event)"
      (touch)="onRangeCommit()"
    />
    <app-around-results
      [items]="nearbyItems()"
      [loading]="nearbyLoading()"
      [error]="nearbyError()"
      [kind]="nearbyKind()"
      (kindChange)="setNearbyKind($event)"
      (retry)="useMyLocation()"
    />
  }
</div>
