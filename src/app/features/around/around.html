<div class="stack around-page">
  <app-page-header
    [title]="i18n.t('around.title')"
    [subtitle]="i18n.t('around.subtitle')"
  />
  <app-section-tabs [tabs]="tabs" [ariaLabel]="i18n.t('nav.fuel')" />

  @if (!requested()) {
    <section class="card around-finder" role="status" aria-live="polite">
      <div class="around-finder__lead">
        <div class="around-finder__visual" aria-hidden="true">
          <span class="around-finder__ring"></span>
          <span class="around-finder__ring"></span>
          <span class="around-finder__ring"></span>
          <span class="around-finder__core"></span>
        </div>
        <p class="around-finder__copy">{{ i18n.t('around.explain') }}</p>
      </div>
      <app-numeric-field
        [label]="i18n.t('around.range')"
        [value]="rangeText()"
        [error]="rangeError()"
        (valueChange)="onRange($event)"
        (touch)="onRangeCommit()"
      />
      <app-primary-button
        [label]="i18n.t('around.useLocation')"
        [stretch]="true"
        [disabled]="nearbyLoading()"
        (pressed)="useMyLocation()"
      />
      <p class="around-or">{{ i18n.t('around.or') }}</p>
      <app-text-field
        [label]="i18n.t('around.area')"
        [value]="areaText()"
        [error]="areaError()"
        (valueChange)="areaText.set($event)"
      />
      <app-primary-button
        [label]="i18n.t('around.areaSearch')"
        tone="quiet"
        [stretch]="true"
        [disabled]="nearbyLoading()"
        (pressed)="searchArea()"
      />
    </section>
  } @else {
    <div class="around-bar">
      <app-numeric-field
        [label]="i18n.t('around.range')"
        [value]="rangeText()"
        [error]="rangeError()"
        (valueChange)="onRange($event)"
        (touch)="onRangeCommit()"
      />
      <app-text-field
        [label]="i18n.t('around.area')"
        [value]="areaText()"
        [error]="areaError()"
        (valueChange)="areaText.set($event)"
      />
      <app-primary-button
        [label]="i18n.t('around.areaSearch')"
        [disabled]="nearbyLoading()"
        (pressed)="searchArea()"
      />
    </div>
    <app-around-results
      [items]="nearbyItems()"
      [loading]="nearbyLoading()"
      [error]="nearbyError()"
      [kind]="nearbyKind()"
      (kindChange)="setNearbyKind($event)"
      (retry)="retrySearch()"
    />
  }
</div>
