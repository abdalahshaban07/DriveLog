<section class="quick-log" [attr.aria-label]="i18n.t('home.quickAdd.title')">
  <header class="quick-log__head">
    <h2 class="quick-log__title">{{ i18n.t('home.quickAdd.title') }}</h2>
    <a routerLink="/fill-up" class="quick-log__full">{{ i18n.t('home.quickAdd.fullForm') }}</a>
  </header>

  <div class="quick-log__row">
    <app-numeric-field
      [label]="i18n.t('fillUp.liters')"
      [(value)]="liters"
    />
    <app-numeric-field
      [label]="i18n.t('fillUp.distanceKm')"
      [(value)]="distanceKm"
    />
  </div>

  @if (needsManualPrice()) {
    <app-numeric-field
      [label]="i18n.t('fillUp.unitPrice')"
      [(value)]="manualUnitPrice"
    />
  } @else if (pricesUnavailable()) {
    <p class="hint" role="status" aria-live="polite">
      {{ i18n.t('fillUp.pricesUnavailable') }}
    </p>
  }

  @if (error()) {
    <p class="err" role="alert">{{ error() }}</p>
  }

  <app-primary-button
    [label]="i18n.t('home.quickAdd.save')"
    [disabled]="!canSave()"
    (pressed)="save()"
  />
</section>
