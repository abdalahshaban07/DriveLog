name: Refresh station data

on:
  schedule:
    # 1st of every month at 03:00 UTC
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install duckdb
        run: pip install duckdb
      - name: Regenerate station data
        run: python scripts/build-eg-data.py
        env:
          DRIVELOG_INSECURE_TLS: '0'
      - name: Commit if changed
        run: |
          if git diff --quiet -- public/data/eg-stations.json public/data/eg-areas.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/eg-stations.json public/data/eg-areas.json
          git commit -m "chore(data): refresh station snapshot"
          git push