name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ng build --base-href /DriveLog/
      - run: |
          # ponytail: GitHub Pages has no SPA fallback; 404.html = index
          cp dist/drivelog/browser/index.html dist/drivelog/browser/404.html
          touch dist/drivelog/browser/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/drivelog/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
