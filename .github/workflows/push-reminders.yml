name: Push reminders

on:
  schedule:
    # 06:15 UTC every day = 08:15 or 09:15 in Cairo.
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only log what would be sent'
        type: boolean
        default: false
      test_push:
        description: 'Send a test notification to every subscribed device'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: push-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    if: ${{ vars.PUSH_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web-push (outside the app project)
        run: |
          mkdir -p "$RUNNER_TEMP/wp"
          cd "$RUNNER_TEMP/wp"
          npm init -y >/dev/null
          npm install web-push@3
      - name: Send due reminders
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          NODE_PATH: ${{ runner.temp }}/wp/node_modules
          TEST_PUSH: ${{ inputs.test_push && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/push-send.mjs
