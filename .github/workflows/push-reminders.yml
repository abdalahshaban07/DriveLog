name: Push reminders

on:
  schedule:
    # 06:15 UTC every day = 08:15 or 09:15 in Cairo.
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only log what would be sent'
        type: boolean
        default: false
      test_push:
        description: 'Send a test notification to every subscribed device'
        type: boolean
        default: false
      only_device:
        description: 'Debug: print reminders and send one sample to the device id prefix'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: push-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    if: ${{ vars.PUSH_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web-push (outside the app project)
        run: |
          mkdir -p "$RUNNER_TEMP/wp"
          cd "$RUNNER_TEMP/wp"
          npm init -y >/dev/null
          npm install web-push@3
      - name: Send due reminders
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          NODE_PATH: ${{ runner.temp }}/wp/node_modules
          TEST_PUSH: ${{ inputs.only_device != '' && '2' || (inputs.test_push && '1' || '0') }}
          ONLY_DEVICE: ${{ inputs.only_device }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/push-send.mjs

  # GitHub switches scheduled workflows off after 60 days without repository activity.
  # If the newest commit is older than 45 days, add one empty commit so the daily job keeps running.
  keepalive:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit when the repo has been quiet
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled reminders enabled"
            git push
          fi
